{{- $crumbs := slice -}}
{{- range .Ancestors.Reverse }}{{ if not .IsHome }}{{ $crumbs = $crumbs | append . }}{{ end }}{{ end -}}
{{- with $crumbs }}
<nav class="breadcrumb" aria-label="경로">
  {{- range $i, $c := . }}{{ if $i }}<span class="sep">›</span>{{ end }}<a href="{{ $c.RelPermalink }}">{{ $c.Title }}</a>{{ end }}
</nav>
{{- end }}
