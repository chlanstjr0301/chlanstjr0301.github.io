<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="주 메뉴">
      {{- range site.Menus.main }}
      {{- $active := or (eq $.Section .Identifier) (eq $.RelPermalink .URL) }}
      <a href="{{ .URL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <button type="button" class="icon-btn search-btn" id="search-open" aria-label="검색 (Ctrl+K)" title="검색 (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="다크 모드" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>
