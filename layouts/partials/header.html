<header class="header">
  <div class="masthead">
    <div class="masthead__top">
      <a class="masthead__title" href="{{ ($.Site.Params.logo.logoHomeLink | default "/") | relURL }}">
        {{- $.Site.Params.logo.logoText | default $.Site.Title -}}
      </a>
      <button id="search-toggle" class="masthead__search" aria-label="검색" data-blog-url="{{ "blog/" | relURL }}">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
        </svg>
      </button>
    </div>
    {{ if len $.Site.Menus }}
    <nav class="masthead__menu">
      {{ range $.Site.Menus.main }}
      <a href="{{ .URL }}"{{ if hasPrefix $.RelPermalink .URL }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    {{ end }}
  </div>
</header>
<script>
(function () {
  var btn = document.getElementById('search-toggle');
  if (!btn) return;
  function openBox() {
    var box = document.querySelector('.search-box');
    if (!box) return false;
    box.classList.add('open');
    var input = document.getElementById('blog-search');
    if (input) input.focus();
    return true;
  }
  btn.addEventListener('click', function () {
    var box = document.querySelector('.search-box');
    if (box) {
      if (box.classList.contains('open')) { box.classList.remove('open'); }
      else { openBox(); }
    } else {
      window.location.href = btn.dataset.blogUrl + '#search';
    }
  });
  if (window.location.hash === '#search') openBox();
})();
</script>
