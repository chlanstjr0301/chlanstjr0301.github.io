{{- /* giscus 댓글: hugo.toml의 [params.giscus]에 repo/repoId/categoryId가 채워져야 표시됨 */ -}}
{{- $g := .Site.Params.giscus -}}
{{- if and $g $g.repoId (eq .Type "blog") (.Param "comments" | default true) -}}
<div class="post-comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ $g.repo }}"
    data-repo-id="{{ $g.repoId }}"
    data-category="{{ $g.category | default "Comments" }}"
    data-category-id="{{ $g.categoryId }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="https://chlanstjr0301.github.io/giscus-newsprint.css"
    data-lang="ko"
    crossorigin="anonymous"
    async>
  </script>
</div>
{{- end -}}
