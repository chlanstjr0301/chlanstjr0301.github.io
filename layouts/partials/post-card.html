{{- $p := . -}}
{{- $cover := partial "cover-src.html" $p -}}
<a class="post-card" href="{{ $p.RelPermalink }}">
  <div class="card-thumb">
    {{- if $cover -}}
    <img src="{{ $cover | relURL }}" alt="" loading="lazy">
    {{- else -}}
    {{- /* [감사 B1] 대표그림 없는 글: 옅은 적갈 틴트 + 카테고리명 */ -}}
    <div class="card-placeholder" aria-hidden="true">
      <span>{{ with $p.Parent }}{{ .Title }}{{ end }}</span>
    </div>
    {{- end -}}
  </div>
  {{ with $p.Parent }}<span class="card-cat">{{ .Title }}</span>{{ end }}
  <h3 class="card-title">{{ $p.Title | markdownify }}</h3>
</a>
