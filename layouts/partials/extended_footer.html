{{ if .Param "math" }}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});document.documentElement.classList.remove('math-pending');"></script>
{{ end }}
{{ if and .IsPage (eq .Type "blog") }}
<script>
// 읽기 진행률 바
(function () {
  var bar = document.createElement('div');
  bar.id = 'reading-progress';
  document.body.prepend(bar);
  function update() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
})();
</script>
{{ end }}
{{ if .IsPage }}
<script>
// 사이드바 목차 스크롤 하이라이트
(function () {
  var toc = document.getElementById('toc-sidebar');
  if (!toc) return;
  var links = toc.querySelectorAll('a[href^="#"]');
  if (!links.length) return;
  var map = {};
  links.forEach(function (a) {
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    map[id] = a;
  });
  var headings = Array.prototype.filter.call(
    document.querySelectorAll('.post-content h1[id],.post-content h2[id],.post-content h3[id],.post-content h4[id]'),
    function (h) { return map[h.id]; }
  );
  if (!headings.length) return;
  var active = null;
  function setActive(id) {
    if (active) active.classList.remove('active');
    active = map[id];
    // 활성 가지만 펼치기: 조상 li에 open 부여
    toc.querySelectorAll('li.open').forEach(function (li) { li.classList.remove('open'); });
    if (active) {
      active.classList.add('active');
      var node = active.parentElement; // li
      while (node && node !== toc) {
        if (node.tagName === 'LI') node.classList.add('open');
        node = node.parentElement;
      }
      var r = active.getBoundingClientRect(), t = toc.getBoundingClientRect();
      if (r.top < t.top || r.bottom > t.bottom) active.scrollIntoView({ block: 'nearest' });
    }
  }
  function onScroll() {
    var current = headings[0].id;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top <= 120) current = headings[i].id;
      else break;
    }
    setActive(current);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
{{ end }}
