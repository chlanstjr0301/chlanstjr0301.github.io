{{- $crumbs := slice -}}
{{- $blogRoot := site.GetPage "/blog" -}}
{{- range .Ancestors.Reverse }}
  {{- if and (not .IsHome) (ne .RelPermalink $blogRoot.RelPermalink) }}{{ $crumbs = $crumbs | append . }}{{ end -}}
{{- end -}}
<nav class="breadcrumb">
  {{- range $crumbs }}<a href="{{ .RelPermalink }}">{{ .Title }}</a><span class="sep">›</span>{{ end -}}
  <span class="current">{{ .Title | markdownify }}</span>
</nav>
