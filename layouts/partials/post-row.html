{{- $p := . -}}
{{- $cover := partial "cover-src.html" $p -}}
<article class="post-row{{ if $cover }} has-thumb{{ end }}">
  <div class="row-body">
    {{ with $p.Parent }}<a class="row-cat" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
    <h2 class="row-title"><a href="{{ $p.RelPermalink }}">{{ $p.Title | markdownify }}</a></h2>
    <div class="row-meta">{{ $p.Date.Format "2006-01-02" }} · {{ $p.ReadingTime }} min read</div>
    {{ with $p.Description }}<p class="row-desc">{{ . }}</p>{{ end }}
  </div>
  {{ with $cover }}
  <a class="row-thumb" href="{{ $p.RelPermalink }}" tabindex="-1" aria-hidden="true">
    <img src="{{ . | relURL }}" alt="" loading="lazy">
  </a>
  {{ end }}
</article>
