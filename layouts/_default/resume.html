<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume — 최문석 (Choi Munseok)</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1d2129;
      --muted: #6b7280;
      --line: #d8dbe0;
      --accent: #b9691f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eceff3;
      color: var(--ink);
      font-family: "Inter", "Noto Sans KR", -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      word-break: keep-all;
    }
    .topbar {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .topbar a { color: var(--muted); text-decoration: none; }
    .topbar a:hover { color: var(--accent); }
    .topbar button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 5px 12px;
      font: inherit;
      color: var(--muted);
      cursor: pointer;
    }
    .topbar button:hover { color: var(--accent); border-color: var(--accent); }
    .sheet {
      max-width: 820px;
      margin: 0 auto 48px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.07);
      padding: 56px 64px;
    }
    h1 {
      text-align: center;
      font-size: 1.9rem;
      margin: 0 0 4px;
      letter-spacing: 0.01em;
    }
    h1 div { display: inline; }
    .resume-contact, p[align="center"] {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .resume-contact a { color: var(--muted); }
    .resume-contact a:hover { color: var(--accent); }
    h2 {
      font-size: 1.02rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink);
      border-bottom: 2px solid var(--ink);
      padding-bottom: 4px;
      margin: 34px 0 12px;
    }
    h3 { font-size: 0.98rem; margin: 18px 0 4px; }
    ul { margin: 6px 0; padding-left: 22px; }
    ul ul { margin: 2px 0; }
    li { margin: 3px 0; }
    li::marker { color: var(--accent); }
    a { color: var(--accent); }
    strong { font-weight: 600; }
    code {
      background: #f1f3f6;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.85em;
    }
    em { color: var(--muted); }
    hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
    .resume-date {
      float: right;
      color: var(--muted);
      font-size: 0.85em;
      font-style: normal;
    }
    @media (max-width: 700px) {
      .sheet { padding: 32px 22px; border-radius: 0; }
    }
    @media print {
      body { background: #fff; }
      .topbar { display: none; }
      .sheet { border: none; box-shadow: none; margin: 0; padding: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/">← Munseok's Blog</a>
    <button onclick="window.print()">Print / PDF</button>
  </nav>
  <main class="sheet">
    {{ .Content }}
  </main>
</body>
</html>
