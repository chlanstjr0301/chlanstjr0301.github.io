baseURL = "https://chlanstjr0301.github.io/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "Martin and Quantitative Investing"
theme = "terminal"
copyright = "Choi Munseok"
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

# KaTeX: $...$ / $$...$$ 구문을 마크다운 처리에서 보호
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["$$", "$$"], ["\\[", "\\]"]]
    inline = [["$", "$"], ["\\(", "\\)"]]

[markup.tableOfContents]
  startLevel = 1
  endLevel = 4

[params]
  contentTypeName = "blog"
  # 인기 글 (블로그 목록 상단 고정) — RelPermalink 기준
  featured = [
    "/blog/financial-engineering/asset-allocation/2026-07-17-black-litterman/",
    "/blog/mathematics/statistics/2026-07-04-q-q-plot/",
  ]
  showMenuItems = 3
  fullWidthTheme = false
  centerTheme = true
  readingTime = true
  Toc = true
  TocTitle = "목차"

[languages]
  [languages.ko]
    label = "한국어"
    title = "Martin and Quantitative Investing"
    copyright = "Choi Munseok"
    [languages.ko.params]
      subtitle = "Be guided by beauty."
      keywords = "quant, finance, mathematics, computer science, economics"
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.ko.params.logo]
        logoText = "Martin and Quantitative Investing"
        logoHomeLink = "/blog/"
    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 1
      [[languages.ko.menu.main]]
        identifier = "projects"
        name = "Project"
        url = "/projects/"
        weight = 2
      [[languages.ko.menu.main]]
        identifier = "blog"
        name = "Blog"
        url = "/blog/"
        weight = 3

# giscus 댓글 설정 — https://giscus.app 에서 발급받은 값으로 채우면 활성화됨
[params.giscus]
  repo = "chlanstjr0301/chlanstjr0301.github.io"
  repoId = "R_kgDOSZzSiQ"
  category = "Announcements"
  categoryId = "DIC_kwDOSZzSic4DAc47"

# 출력: 홈에서 검색 인덱스(index.json)도 생성
[outputs]
  home = ["html", "rss", "json"]
