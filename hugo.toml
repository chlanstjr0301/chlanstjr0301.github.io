baseURL = "https://chlanstjr0301.github.io/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "Munseok's Log"
copyright = "Choi Munseok"
# 한글 글의 읽기 시간·요약을 글자 수 기준으로 계산
hasCJKLanguage = true
# 오프셋 없이 쓴 날짜를 한국 시간으로 읽는다 (안 쓰면 UTC로 읽어 9시간 동안 미래 글로 빠짐)
timeZone = "Asia/Seoul"
# 태그 이름을 쓴 그대로 표시 (자동 Title Case 끔)
titleCaseStyle = "none"

[markup.goldmark.renderer]
  unsafe = true

# 단독 줄 이미지를 <p>로 감싸지 않음 → 캡션 있는 그림을 <figure>로 렌더
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# KaTeX: $...$ / $$...$$ 구문을 마크다운 처리에서 보호
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["$$", "$$"], ["\\[", "\\]"]]
    inline = [["$", "$"], ["\\(", "\\)"]]

# 코드 하이라이팅: 클래스 방식 → assets/css/syntax.css 가 라이트/다크 색을 정한다
[markup.highlight]
  noClasses = false
  guessSyntax = true

[markup.tableOfContents]
  startLevel = 1
  endLevel = 3

[taxonomies]
  tag = "tags"

[params]
  description = "Be guided by beauty."
  github = "https://github.com/chlanstjr0301"
  # 홈 '최근 포스트'·전체 글 목록에 모으는 섹션
  mainSections = ["dev", "quant", "investment"]
  homeRecent = 6
  # 카드 대신 "제목·요약·날짜" 줄 목록을 쓰는 섹션 (그림 없는 글이 많은 곳)
  rowSections = ["dev", "investment"]
  # 조회수: goatcounter.com 에서 만든 사이트 코드(예: "munseok")를 넣으면 켜진다. 비우면 꺼짐.
  #   GoatCounter 설정에서 "Allow adding visitor counts on your website"를 켜야 숫자가 보인다.
  goatcounter = "munseok"
  # 목차 기본값 (글에서 toc: false 로 끔)
  toc = true
  # SNS 미리보기 기본 그림 (글에 cover/본문 그림이 있으면 그걸 씀)
  images = ["/og-image.png"]
  # 홈 '추천 포스트'는 글 front matter의 featured: true 로 고른다

# 상단 탭 — identifier는 섹션 폴더 이름과 같아야 현재 탭이 강조된다
[menus]
  [[menus.main]]
    identifier = "dev"
    name = "Dev Blog"
    pageRef = "/dev"
    weight = 1
  [[menus.main]]
    identifier = "quant"
    name = "Quant Blog"
    pageRef = "/quant"
    weight = 2
  [[menus.main]]
    identifier = "investment"
    name = "Investment"
    pageRef = "/investment"
    weight = 3
  [[menus.main]]
    identifier = "projects"
    name = "Project"
    pageRef = "/projects"
    weight = 4
  [[menus.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 5

# giscus 댓글 — 글 front matter에 comments: false 를 쓰면 그 글만 끈다
[params.giscus]
  repo = "chlanstjr0301/chlanstjr0301.github.io"
  repoId = "R_kgDOSZzSiQ"
  category = "Announcements"
  categoryId = "DIC_kwDOSZzSic4DAc47"

[outputs]
  home = ["html", "rss"]
