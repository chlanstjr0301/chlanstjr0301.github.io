baseURL = "https://chlanstjr0301.github.io/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "Munseok and Quantitative Investing"
theme = "terminal"
copyright = "Choi Munseok"
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

# KaTeX: $...$ / $$...$$ 구문을 마크다운 처리에서 보호
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["$$", "$$"], ["\\[", "\\]"]]
    inline = [["$", "$"], ["\\(", "\\)"]]

# 코드 하이라이팅: 인라인 스타일(모노카이) 대신 클래스 → 테마 변수 팔레트가 적용됨
[markup.highlight]
  noClasses = false
  guessSyntax = true

[markup.tableOfContents]
  startLevel = 1
  endLevel = 4

[params]
  contentTypeName = "blog"
  showMenuItems = 5
  fullWidthTheme = false
  centerTheme = true
  readingTime = true
  Toc = true
  TocTitle = "목차"

# 섹션별 목록 설정 — layouts/_default/section.html 이 읽는다. 키는 전부 소문자.
#   catpanel   좌측 카테고리 패널(햄버거) 표시
#   search     목록 상단 검색창 표시 (검색은 자기 섹션 글만 대상)
#   pagination 글 하단 이전/다음 글 링크
#   featured   목록 상단 고정 인기 글 — RelPermalink 기준
[params.sections.blog]
  catpanel = true
  search = true
  pagination = true
  comments = true
  featured = [
    "/blog/quantitative-finance/portfolio-risk/black-litterman/",
    "/blog/foundations/probability-statistics/q-q-plot/",
  ]

# dev는 글이 쌓이면 catpanel·search를 true로 올린다 (0편에서는 빈 패널만 보임)
[params.sections.dev]
  catpanel = false
  search = false
  pagination = true
  comments = true
  featured = []

[languages]
  [languages.ko]
    label = "한국어"
    title = "Munseok and Quantitative Investing"
    copyright = "Choi Munseok"
    [languages.ko.params]
      subtitle = "Be guided by beauty."
      keywords = "quant, finance, mathematics, computer science, economics"
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.ko.params.logo]
        logoText = "Munseok and Quantitative Investing"
        logoHomeLink = "/blog/"
    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 1
      [[languages.ko.menu.main]]
        identifier = "projects"
        name = "Project"
        url = "/projects/"
        weight = 2
      [[languages.ko.menu.main]]
        identifier = "blog"
        name = "Blog"
        url = "/blog/"
        weight = 3
      [[languages.ko.menu.main]]
        identifier = "dev"
        name = "Dev"
        url = "/dev/"
        weight = 4
      [[languages.ko.menu.main]]
        identifier = "diary"
        name = "Investment Diary"
        url = "/diary/"
        weight = 5

# giscus 댓글 설정 — https://giscus.app 에서 발급받은 값으로 채우면 활성화됨
[params.giscus]
  repo = "chlanstjr0301/chlanstjr0301.github.io"
  repoId = "R_kgDOSZzSiQ"
  category = "Announcements"
  categoryId = "DIC_kwDOSZzSic4DAc47"

# 출력: 홈에서 검색 인덱스(index.json)도 생성
[outputs]
  home = ["html", "rss", "json"]
